# Refreshes Sniffari's open-data places (OpenStreetMap dog parks in NSW) every Monday morning, Sydney time.
# Needs repository secrets SNIFFARI_SUPABASE_URL and SNIFFARI_SUPABASE_SERVICE_ROLE_KEY; does nothing without them.
name: Sniffari open-data import

on:
  schedule:
    - cron: "17 19 * * 0" # Sunday 19:17 UTC = Monday morning in Sydney
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sniffari
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import OpenStreetMap dog parks
        run: node --experimental-strip-types scripts/import-osm.ts
        env:
          SUPABASE_URL: ${{ secrets.SNIFFARI_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SNIFFARI_SUPABASE_SERVICE_ROLE_KEY }}
